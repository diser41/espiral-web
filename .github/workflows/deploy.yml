name: Deploy a CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # para asumir los roles de AWS con OIDC (sin llaves guardadas)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Roles creados por infra/bootstrap.yml (no son secretos).
env:
  AWS_REGION: us-east-1
  STACK_NAME: espiral-web
  INFRA_ROLE_ARN: arn:aws:iam::005615275980:role/espiral-web-github-infra
  CFN_EXEC_ROLE_ARN: arn:aws:iam::005615275980:role/espiral-web-cfn-exec
  DEPLOY_ROLE_ARN: arn:aws:iam::005615275980:role/espiral-web-github-deploy

jobs:
  infra:
    name: Infraestructura (CloudFormation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Aplicar infra/cloudfront.yml
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/cloudfront.yml \
            --role-arn "$CFN_EXEC_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  sitio:
    name: Sitio (S3 + CloudFront)
    needs: infra
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://lecturasespiral.com
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Leer salidas del stack
        run: |
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "S3_BUCKET=$(out BucketName)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(out DistributionId)" >> "$GITHUB_ENV"

      - name: Subir sitio a S3
        run: |
          mkdir -p _site
          cp index.html _site/
          aws s3 sync _site "s3://$S3_BUCKET" --delete \
            --cache-control "public, max-age=300"

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
